name: Validate Engineering Harness

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: Validate configuration, permissions, rules, and tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run harness validator (template mode)
        run: python3 scripts/validate_harness.py --mode template

      - name: Run validator unit tests
        run: python3 -m unittest discover -s tests -v
